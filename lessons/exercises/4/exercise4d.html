<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Form Exercise</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .email-input,
    .password-input {
      padding: 15px;
      border-width: 1px;
      border-color: gray;
      border-style: none;
      background-color: rgb(223, 221, 221);
      margin-bottom: 20px;
      border-radius: 4px;
      size: 50;
    }

    input:focus {
    outline: 1px solid transparent;
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25);
  }

    .btn-container {
      display: flex;
      gap: 10px;
    }

    .login-btn, .signup-btn {
      border: none;
      padding: 15px 20px;
      border-radius: 6px;
      cursor: pointer;
      background-color: rgb(0, 123, 255);
      color: white;
      font-weight: 500;
    }

    .visibility {
      margin-left: 10px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="js-container"></div>


  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>


  <script src="https://unpkg.com/supersimpledev/babel.js"></script>

  <script type="text/babel">

    function LoginForm () {
      const [isVisible, setIsVisible] = React.useState(false);

      const toggleVisibility = () => {
        setIsVisible(!isVisible);
      }
      return (
        <>
          <h1>Hello, Welcome to my website!</h1>
          <div>
            <input placeholder="Email" type="email" className="email-input" />
          </div>
          <div>
            <input placeholder="Password" type={isVisible ? "text" : "password"} className="password-input" />  
            <button class="visibility" onClick={toggleVisibility}>
              {isVisible ? "Hide" : "Show"}  
            </button>
          </div>


          <div className="btn-container">
            <button className="login-btn">Login</button>
            <button className="signup-btn">Sign Up</button>
          </div>
        </>
      );
    }


    function App () {
      return (
        <>
          <LoginForm />
        </>
      );
    }


    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>
</html>
