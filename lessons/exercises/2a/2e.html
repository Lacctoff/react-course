<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React basics</title>
</head>
<body>
  <div class="js-container"></div>


  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>


  <script src="https://unpkg.com/supersimpledev/babel.js"></script>

  <script type="text/babel">

    function ProductDetails ({ name, price, discountPrice, imageSrc }) {
      return (
        <div>
          {imageSrc && (
            <img 
              src={imageSrc} 
              alt={name} 
              width="150" 
              height="150" 
              style={{marginTop: '10px'}} 
            />
          )}
          <p>{name}</p>
          {/*}
          {!discountPrice && (
            <p>Price: {price}</p>
          )}
          {discountPrice && (
            <del>Price: {price}</del>
          )}
          */}
          {/*using ternary operator instead of the guard operator*/}
          {discountPrice ? (
            <del>Price: {price}</del>
          ) : (
            <p>Price: {price}</p>
          )}
          {discountPrice && (
            <p>Discount Price: {discountPrice}</p>
          )}
          <button>Add to Cart</button>
        </div>
      );
    }


    function App () {
      return (
        <>
          <ProductDetails
            name="Cotton socks"
            price="$10.90"
            discountPrice="$5.45"
            imageSrc="./cotton-socks.png"
          />
          <ProductDetails
            name="Tennis balls"
            price="$6.00"
            imageSrc="./tennis-balls.png"
          />
          <ProductDetails
            name="Plain T-shirt"
            price="$7.99"
            imageSrc="./plain-t-shirt.png"
          />
        </>
      );
    }


    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>
</html>
