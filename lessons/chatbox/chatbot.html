<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot</title>
  <style>

    body {
      font-family: Arial;
      margin: 0;
    }
    .send-button {
      background-color: rgb(25, 135, 84);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      margin-left: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;

      
    }

    .chat-input {
      padding: 12px 20px;
      border-radius: 10px;
      border-width: 1px;
      font-size: 15px;

      flex-grow: 1;
    }

    .chat-input-container {
      display: flex;
      margin-bottom: 60px;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;

      height: 100vh;
    }

    .chat-message-user {
      display: flex;
      justify-content: end;
      align-items: start;
      
    }

    .chat-message-robot {
      display: flex;
      align-items: start;
      padding: 15px 20px;
    }

    .chat-message-text {
      background-color: rgb(238, 238, 238);
      padding: 15px 20px;
      border-radius: 10px;
      margin-right: 10px;
      margin-left: 10px;
      margin-bottom: 20px;
      max-width: 300px;
    }

    .chat-message-profile {
      width: 45px;
      height: 45px;
      border-radius: 50%;
    }

    .chat-messages-container {
      flex-grow: 1;
      padding-top: 20px;
      overflow: scroll;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div class="js-container"></div>


  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>


  <script src="https://unpkg.com/supersimpledev/babel.js"></script>

  <script type="text/babel">
    function ChatInput ({ chatMessages, setChatMessages }) {
      const [inputText, setInputText] = React.useState('');
      function saveInputText (event) {
        setInputText(event.target.value);
      };

      function sendMessage () {
        const newChatMessages = [
          ...chatMessages,
          {
          id: crypto.randomUUID(),
          message: inputText,
          sender: "user"
          }
        ]
        setChatMessages(newChatMessages);

        const response = Chatbot.getResponse(inputText);
        console.log(response);

        setChatMessages([
          ...newChatMessages,
          {
            id: crypto.randomUUID(),
            message: response,
            sender: "robot"
          }
        ]);

        setInputText('');
      }
      return (
        <div className="chat-input-container">
          <input 
            placeholder="Send a message to Chatbot" 
            size="30"
            onChange={saveInputText}
            value={inputText}
            className="chat-input"
          />
          <button onClick={sendMessage} className="send-button">
            Send
          </button>
        </div>
      );
    }

    function ChatMessage ({ message, sender }) {
      //const message = props.message;
      //const sender = props.sender;

      //const { message, sender } = props;

     /* if (sender === 'robot') {
        return (
          <div>
            <img src="./robot.png" alt="Chatbot" width="50"/>
            {message}
          </div>
        )
      }*/

      return (
        <div className={sender === 'user' ? 'chat-message-user' : 'chat-message-robot'}>
          {sender === 'robot' && (
            <img src="./robot.png" alt="Chatbot" className="chat-message-profile"/>
          )}
          <div className="chat-message-text">
            {message}
          </div>
          {sender === 'user' && (
            <img src="./user.png" alt="Chatbot" className="chat-message-profile"/>
          )}
        </div>
      )
    };

    function ChatMessages ({ chatMessages }) {
      const chatMessagesRef = React.useRef(null);
      React.useEffect(() => {
        const containerElem = chatMessagesRef.current;
        containerElem.scrollTop = containerElem.scrollHeight;
      }, [chatMessages]);


      return (
        <div className="chat-messages-container" ref={chatMessagesRef}>
          
          {chatMessages.map((chatMessage) => {
            return (
              <ChatMessage 
                message={chatMessage.message} 
                sender={chatMessage.sender}
                key={chatMessage.id}
              />
            )
      })}
        </div>
      )
    };
    

    // this is the central app component that will render the chatInput component and others.. hmmm
    function App () {
      const [chatMessages, setChatMessages] = React.useState([{
          id: 'id1',
          message: "Hello chatbot!",
          sender: "user"
        },
        {
          id: 'id2',
          message: "Hello! How can i help you?",
          sender: "robot"
        },
        {
          id: 'id3',
          message: "Can you get me todays date?",
          sender: "user"
        },
        {
          id: 'id4',
          message: "Today is November 19",
          sender: "robot"
        }
      ]);
      //const [chatMessages, setChatMessages] = array;
      //const chatMessages = array[0];
      //const setChatMessages = array[1];
      return (
        <div className="app-container">
        <ChatMessages 
          chatMessages={chatMessages}
        />
        <ChatInput 
          chatMessages={chatMessages}
          setChatMessages={setChatMessages}
        />
        </div>
      )
      
    }


    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>
</html>
